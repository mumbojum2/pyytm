<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicGrab Pro - YouTube Music Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass-effect { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .explicit-badge { background: #dc2626; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-left: 8px; }
        .hover-lift { transition: all 0.3s ease; }
        .hover-lift:hover { transform: translateY(-5px); }
        .thumbnail-loading { background: linear-gradient(45deg, #f3f4f6, #e5e7eb, #f3f4f6); background-size: 200% 200%; animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .audio-player { width: 100%; height: 40px; outline: none; }
        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #10b981; transition: width 0.1s ease; }
        .play-button-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
        .play-button-overlay:hover { opacity: 1; }
        .suggestions-dropdown {
    position: absolute;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 1rem;
    margin-top: 0.5rem;
    padding: 0.5rem 0;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.2);
    z-index: 1000;
    max-height: 300px;
    overflow-y: auto;
}
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div id="app"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_BASE = window.location.origin;

        function App() {
const [activeTab, setActiveTab] = useState('home');
const [searchQuery, setSearchQuery] = useState('');
const [searchResults, setSearchResults] = useState({songs: [], artists: [], albums: []});
const [suggestions, setSuggestions] = useState([]);
const [showSuggestions, setShowSuggestions] = useState(false);
const [songs, setSongs] = useState([]);
const [artists, setArtists] = useState([]);
const [libraryData, setLibraryData] = useState({songs: [], albums: [], artists: [], playlists: []});
const [browserJson, setBrowserJson] = useState('');
const [userAuthenticated, setUserAuthenticated] = useState(false);
const [searchHistory, setSearchHistory] = useState([]);
const [downloading, setDownloading] = useState(null);
const [searchFocused, setSearchFocused] = useState(false);
const [loading, setLoading] = useState(false);
const [message, setMessage] = useState({ text: '', type: '' });
const [loadedThumbnails, setLoadedThumbnails] = useState(new Set());
const [homeData, setHomeData] = useState({recommendations: [], featured: [], authenticated: false});
const [artistPage, setArtistPage] = useState(null);
const [nowPlaying, setNowPlaying] = useState(null);
const [audioProgress, setAudioProgress] = useState(0);
const [viewCounts, setViewCounts] = useState({});

const searchRef = useRef(null);
const suggestionTimer = useRef(null);
const abortControllerRef = useRef(null); // NEW: For request cancellation
const audioRef = useRef(null);

const showMessage = (text, type = 'info') => {
    setMessage({ text, type });
    setTimeout(() => setMessage({ text: '', type: '' }), 4000);
};

// OPTIMIZED: Parallel data loading
useEffect(() => {
    const loadInitialData = async () => {
        try {
            // Load all data in parallel instead of sequentially
            await Promise.all([
                loadHomeData(),
                loadSongs(),
                loadArtists(),
                loadSearchHistory()
            ]);
            checkAuthentication();
        } catch (error) {
            console.error('Initial data loading error:', error);
        }
    };
    
    loadInitialData();
}, []);

// OPTIMIZED: Faster search handling with request cancellation
useEffect(() => {
    if (searchQuery.length >= 2) {
        // Cancel previous request immediately
        if (abortControllerRef.current) {
            abortControllerRef.current.abort();
        }
        
        // Clear previous timer
        if (suggestionTimer.current) clearTimeout(suggestionTimer.current);
        
        // FASTER: Reduced from 200ms to 120ms for quicker response
        suggestionTimer.current = setTimeout(() => {
            fetchSuggestions(searchQuery);
        }, 120);
    } else {
        // Hide suggestions immediately when query is too short
        setShowSuggestions(false);
        setSuggestions([]);
    }
    
    // Cleanup function
    return () => {
        if (suggestionTimer.current) {
            clearTimeout(suggestionTimer.current);
        }
    };
}, [searchQuery]);

// OPTIMIZED: Fast suggestions with cancellation
const fetchSuggestions = async (currentQuery) => {
    if (!currentQuery || !currentQuery.trim() || currentQuery.length < 2) {
        setSuggestions([]);
        setShowSuggestions(false);
        return;
    }

    // Cancel any previous request
    if (abortControllerRef.current) {
        abortControllerRef.current.abort();
    }
    
    // Create new abort controller for this request
    abortControllerRef.current = new AbortController();

    try {
        const response = await fetch(`${API_BASE}/api/suggestions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: currentQuery }),
            signal: abortControllerRef.current.signal
        });

        if (response.ok) {
            const data = await response.json();
            
            // Only update state if this is still the current query
            if (currentQuery === searchQuery) {
                const newSuggestions = (data.suggestions || []).slice(0, 5);
                setSuggestions(newSuggestions);
                setShowSuggestions(newSuggestions.length > 0);
            }
        }
    } catch (error) {
        if (error.name !== 'AbortError') {
            console.error('Suggestions error:', error);
        }
    }
};

            const loadHomeData = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/home`);
                    if (response.ok) {
                        const data = await response.json();
                        setHomeData(data);
                        setUserAuthenticated(data.authenticated);
                    }
                } catch (error) {
                    console.error('Home data error:', error);
                }
            };

            const loadLibraryData = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/library`);
                    if (response.ok) {
                        const data = await response.json();
                        setLibraryData(data.library);
                        setUserAuthenticated(data.authenticated);
                    }
                } catch (error) {
                    console.error('Library data error:', error);
                }
            };

            const loadSongs = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/songs`);
                    if (response.ok) {
                        const data = await response.json();
                        setSongs(data.songs || []);
                    }
                } catch (error) {}
            };

            const loadArtists = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/artists`);
                    if (response.ok) {
                        const data = await response.json();
                        setArtists(data.artists || {});
                    }
                } catch (error) {}
            };

            const loadSearchHistory = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/search-history`);
                    if (response.ok) {
                        const data = await response.json();
                        setSearchHistory(data.history || []);
                    }
                } catch (error) {}
            };

            const checkAuthentication = async () => {
                const savedAuth = localStorage.getItem('userAuthenticated');
                if (savedAuth === 'true') {
                    setUserAuthenticated(true);
                }
            };
            
            const handleSearch = async (query = searchQuery) => {
                const searchTerm = query.trim();
                if (!searchTerm) {
                    showMessage('Please enter a search term', 'error');
                    return;
                }

                setSearchQuery(searchTerm);
                setShowSuggestions(false);
                setLoading(true);
                setActiveTab('search');
                
                try {
                    const response = await fetch(`${API_BASE}/api/search`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: searchTerm })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Search failed');
                    }
                    
                    const data = await response.json();
                    setSearchResults(data);
                    
                } catch (error) {
                    console.error('Search error:', error);
                    showMessage('Search failed. Please try again.', 'error');
                    setSearchResults({songs: [], artists: [], albums: []});
                } finally {
                    setLoading(false);
                }
            };

            const handleArtistClick = async (artistId) => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/api/artist/${artistId}`);
                    if (response.ok) {
                        const data = await response.json();
                        setArtistPage(data);
                        setActiveTab('artist');
                    } else {
                        throw new Error('Artist not found');
                    }
                } catch (error) {
                    showMessage('Failed to load artist', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handlePlaySong = async (song) => {
                try {
                    showMessage(`🔄 Loading: ${song.title}`, 'info');
                    
                    const response = await fetch(`${API_BASE}/api/stream/${song.id}`);
                    const data = await response.json();
                    
                    if (data.success && data.streamUrl) {
                        const proxyUrl = `${API_BASE}/api/proxy-audio?url=${encodeURIComponent(data.streamUrl)}`;
                        
                        setNowPlaying({ 
                            ...song, 
                            audioUrl: proxyUrl,
                            isStream: true 
                        });
                        
                        if (audioRef.current) {
                            audioRef.current.src = proxyUrl;
                            audioRef.current.load();
                            setTimeout(() => {
                                audioRef.current.play().catch(e => {
                                    console.log('Auto-play prevented, user can click play button');
                                });
                            }, 100);
                        }
                        
                        showMessage(`🎵 Now playing: ${song.title}`, 'success');
                    } else {
                        throw new Error(data.error || 'Could not get audio stream');
                    }
                } catch (error) {
                    console.error('Play error:', error);
                    showMessage('Failed to play song. Try downloading instead.', 'error');
                }
            };

            const handleDownload = async (song) => {
                setDownloading(song.id);
                try {
                    const payload = {
                        videoId: song.id,
                        title: song.title,
                        artist: song.artist,
                        album: song.album || '',
                        thumbnail: song.thumbnail || '',
                        format: 'mp3'
                    };

                    showMessage(`⬇️ Starting download: ${song.title}`, 'info');

                    const response = await fetch(`${API_BASE}/api/download`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Download failed');
                    }

                    const data = await response.json();
                    if (data.status === 'success') {
                        const cleanFilename = `${song.artist} - ${song.title}.mp3`.replace(/[<>:"/\\|?*]/g, '');
                        const link = document.createElement('a');
                        link.href = `${API_BASE}${data.downloadUrl}`;
                        link.download = cleanFilename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        showMessage(`✅ "${song.title}" downloaded!`, 'success');
                        await Promise.all([loadSongs(), loadArtists()]);
                    } else {
                        throw new Error(data.error || 'Download failed');
                    }
                } catch (error) {
                    console.error('Download error:', error);
                    showMessage(`❌ ${error.message}`, 'error');
                } finally {
                    setDownloading(null);
                }
            };

            const downloadToComputer = async (songId) => {
                try {
                    const response = await fetch(`${API_BASE}/api/download-file/${songId}`);
                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        const song = songs.find(s => s.id === songId) || { artist: 'Unknown', title: 'Unknown' };
                        a.download = `${song.artist} - ${song.title}.mp3`.replace(/[<>:"/\\|?*]/g, '');
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                        showMessage('📥 Song saved to your computer!', 'success');
                    } else {
                        throw new Error('Failed to download file');
                    }
                } catch (error) {
                    console.error('Download to computer failed:', error);
                    showMessage('Failed to save song', 'error');
                }
            };

            const playDownloadedSong = async (songId) => {
                try {
                    const song = songs.find(s => s.id === songId);
                    if (!song) return;
                    const audioUrl = `${API_BASE}/api/play-song/${songId}`;
                    setNowPlaying({ ...song, audioUrl });
                    if (audioRef.current) {
                        audioRef.current.src = audioUrl;
                        audioRef.current.load();
                        audioRef.current.play().catch(e => {
                            console.log('Auto-play prevented');
                        });
                    }
                    showMessage(`🎵 Playing: ${song.title}`, 'success');
                } catch (error) {
                    showMessage('Failed to play song', 'error');
                }
            };

            const handleAudioTimeUpdate = () => {
                if (audioRef.current) {
                    const progress = (audioRef.current.currentTime / audioRef.current.duration) * 100;
                    setAudioProgress(progress || 0);
                }
            };

            // Add these handler functions to your React component
const handleExportData = async () => {
    try {
        const response = await fetch(`${API_BASE}/api/export-data`);
        if (response.ok) {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `musicgrab_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            showMessage('✅ Data exported successfully!', 'success');
        } else {
            throw new Error('Export failed');
        }
    } catch (error) {
        console.error('Export error:', error);
        showMessage('Failed to export data', 'error');
    }
};

const handleImportData = async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetch(`${API_BASE}/api/import-data`, {
            method: 'POST',
            body: formData
        });

        const data = await response.json();
        if (response.ok && data.success) {
            showMessage('✅ Data imported successfully!', 'success');
            // Reload the data
            await loadSongs();
            await loadArtists();
            await loadSearchHistory();
        } else {
            throw new Error(data.error || 'Import failed');
        }
    } catch (error) {
        console.error('Import error:', error);
        showMessage(`❌ ${error.message}`, 'error');
    }
    
    // Reset the file input
    event.target.value = '';
};

            const handleAuthenticate = async () => {
                if (!browserJson.trim()) {
                    showMessage('Please paste your browser.json content', 'error');
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/api/authenticate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ browserJson })
                    });

                    const data = await response.json();
                    if (response.ok && data.success) {
                        setUserAuthenticated(true);
                        localStorage.setItem('userAuthenticated', 'true');
                        showMessage('✅ Authentication successful!', 'success');
                        await loadHomeData();
                        await loadLibraryData();
                    } else {
                        throw new Error(data.error || 'Authentication failed');
                    }
                } catch (error) {
                    showMessage(`❌ ${error.message}`, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const formatViews = (views) => {
                if (!views || views === 0) return "No views";
                
                try {
                    views = parseInt(views);
                    if (isNaN(views)) return "No views";
                    
                    if (views >= 1000000000) {
                        return `${(views / 1000000000).toFixed(1)}B views`;
                    } else if (views >= 1000000) {
                        return `${(views / 1000000000).toFixed(1)}M views`;
                    } else if (views >= 1000) {
                        return `${(views / 1000).toFixed(1)}K views`;
                    } else {
                        return `${views.toLocaleString()} views`;
                    }
                } catch {
                    return "No views";
                }
            };

            const tabs = [
                { id: 'home', label: 'Home', icon: 'fas fa-home' },
                { id: 'search', label: 'Search', icon: 'fas fa-search' },
                ...(userAuthenticated ? [
                    { id: 'library-songs', label: 'Library Songs', icon: 'fas fa-music' },
                    { id: 'library-artists', label: 'Library Artists', icon: 'fas fa-users' },
                    { id: 'library-albums', label: 'Library Albums', icon: 'fas fa-compact-disc' },
                    { id: 'library-playlists', label: 'Library Playlists', icon: 'fas fa-list' }
                ] : []),
                { id: 'songs', label: 'Your Songs', icon: 'fas fa-download' },
                { id: 'artists', label: 'Your Artists', icon: 'fas fa-user-friends' },
                { id: 'settings', label: 'Settings', icon: 'fas fa-cog' }
            ];

            return (
                <div className="min-h-screen pb-20">
                    {/* Message Toast */}
                    {message.text && (
                        <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg max-w-md ${
                            message.type === 'error' ? 'bg-red-500 text-white' :
                            message.type === 'success' ? 'bg-green-500 text-white' :
                            'bg-blue-500 text-white'
                        }`}>
                            {message.text}
                        </div>
                    )}

                    {/* Audio Player */}
                    <audio 
                        ref={audioRef}
                        onTimeUpdate={handleAudioTimeUpdate}
                        onEnded={() => setNowPlaying(null)}
                        className="hidden"
                    />

                    {/* Now Playing Bar */}
                    {nowPlaying && (
                        <div className="fixed bottom-0 left-0 right-0 bg-black/90 text-white p-4 z-40 border-t border-white/20">
                            <div className="max-w-7xl mx-auto flex items-center justify-between">
                                <div className="flex items-center gap-4 flex-1">
                                    <img 
                                        src={nowPlaying.thumbnail} 
                                        alt={nowPlaying.title}
                                        className="w-12 h-12 rounded-lg object-cover"
                                    />
                                    <div className="flex-1 min-w-0">
                                        <h4 className="font-semibold text-sm truncate">{nowPlaying.title}</h4>
                                        <p className="text-white/70 text-xs truncate">{nowPlaying.artist}</p>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-4 flex-1 justify-center">
                                    <button 
                                        onClick={() => audioRef.current && (audioRef.current.currentTime -= 10)}
                                        className="text-white/80 hover:text-white"
                                    >
                                        <i className="fas fa-backward-step text-xl"></i>
                                    </button>
                                    <button 
                                        onClick={() => audioRef.current && (audioRef.current.paused ? audioRef.current.play() : audioRef.current.pause())}
                                        className="bg-white text-black rounded-full w-10 h-10 flex items-center justify-center hover:bg-white/90"
                                    >
                                        <i className={`fas ${audioRef.current && !audioRef.current.paused ? 'fa-pause' : 'fa-play'}`}></i>
                                    </button>
                                    <button 
                                        onClick={() => audioRef.current && (audioRef.current.currentTime += 10)}
                                        className="text-white/80 hover:text-white"
                                    >
                                        <i className="fas fa-forward-step text-xl"></i>
                                    </button>
                                </div>

                                <div className="flex items-center gap-4 flex-1 justify-end">
                                    <div className="w-32">
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{width: `${audioProgress}%`}}></div>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setNowPlaying(null)}
                                        className="text-white/80 hover:text-white"
                                    >
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <div className="glass-effect border-b border-white/20 sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                        <i className="fas fa-music text-purple-600 text-xl"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-bold text-white">MusicGrab Pro</h1>
                                        <p className="text-white/70 text-sm">YouTube Music Downloader</p>
                                    </div>
                                </div>
                                
                                {/* Search Bar */}
                                <div className="flex-1 max-w-2xl mx-8" ref={searchRef}>
                                    <div className="relative">
                                        <div className={`bg-white/20 rounded-full transition-all duration-200 ${searchFocused ? 'ring-2 ring-white/50' : ''}`}>
                                            <div className="flex items-center px-6 py-3">
                                                <i className="fas fa-search text-white/70 mr-3"></i>
                                                <input 
                                                    type="text"
                                                    value={searchQuery}
                                                    onChange={(e) => setSearchQuery(e.target.value)}
                                                    onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
                                                    onFocus={() => setSearchFocused(true)}
                                                    onBlur={() => setTimeout(() => setSearchFocused(false), 200)}
                                                    placeholder="Search for songs, artists, or albums..."
                                                    className="flex-1 outline-none text-white placeholder-white/70 bg-transparent text-lg"
                                                />
                                                {searchQuery && (
                                                    <button 
                                                        onClick={() => {
                                                            setSearchQuery('');
                                                            setSearchResults({songs: [], artists: [], albums: []});
                                                            setShowSuggestions(false);
                                                        }}
                                                        className="ml-3 text-white/70 hover:text-white"
                                                    >
                                                        <i className="fas fa-times"></i>
                                                    </button>
                                                )}
                                            </div>
                                        </div>

{/* Search Suggestions - UPDATED */}
{showSuggestions && suggestions.length > 0 && (
    <div className="suggestions-dropdown">
        {suggestions.map((suggestion, idx) => (
            <button
                key={idx}
                onClick={() => {
                    setSearchQuery(suggestion);
                    handleSearch(suggestion);
                }}
                className="w-full px-6 py-3 text-left hover:bg-purple-50 flex items-center gap-3 transition-colors"
            >
                <i className="fas fa-search text-purple-500"></i>
                <span className="text-gray-700 truncate">{suggestion}</span>
            </button>
        ))}
    </div>
)}
                                    </div>
                                </div>

                                <div className="flex items-center gap-4">
                                    {userAuthenticated && (
                                        <div className="bg-green-500/20 text-green-300 px-3 py-1 rounded-full text-sm">
                                            <i className="fas fa-check-circle mr-2"></i>
                                            Connected
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Navigation */}
                    <div className="bg-white/10 border-b border-white/20 sticky top-16 z-20">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex space-x-1 overflow-x-auto">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => {
                                            setActiveTab(tab.id);
                                            if (tab.id !== 'artist') setArtistPage(null);
                                            if (tab.id.startsWith('library-')) loadLibraryData();
                                        }}
                                        className={`py-4 px-4 font-medium transition-all border-b-2 whitespace-nowrap ${
                                            activeTab === tab.id 
                                                ? 'text-white border-white' 
                                                : 'text-white/70 border-transparent hover:text-white'
                                        }`}
                                    >
                                        <i className={`${tab.icon} mr-2`}></i>
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

{/* Main Content */}
<div className="max-w-7xl mx-auto px-6 py-8">
    {/* Home Page */}
    {activeTab === 'home' && (
        <div className="fade-in">
            <div className="text-center mb-12">
                <h1 className="text-4xl font-bold text-white mb-4">
                    {userAuthenticated ? 'Welcome Back!' : 'Welcome to MusicGrab Pro'}
                </h1>
                <p className="text-white/80 text-xl">
                    {userAuthenticated 
                        ? 'Your personalized music experience awaits' 
                        : 'Discover and download your favorite music'
                    }
                </p>
            </div>

            {/* Featured Sections */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                {homeData.featured.map((item, index) => (
                    <div key={item.id} className={`bg-gradient-to-br ${item.color} rounded-2xl p-6 text-white hover-lift cursor-pointer`}>
                        <div className="text-3xl mb-4">
                            <i className={item.icon}></i>
                        </div>
                        <h3 className="font-bold text-lg mb-2">{item.title}</h3>
                        <p className="text-white/80 text-sm">{item.subtitle}</p>
                    </div>
                ))}
            </div>

            {/* Recommendations */}
            <div className="mb-8">
                <h2 className="text-2xl font-bold text-white mb-6">
                    {userAuthenticated ? 'Recommended For You' : 'Popular Right Now'}
                </h2>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                    {homeData.recommendations.map((rec, index) => (
                        <div key={rec.id} className="bg-white/10 rounded-2xl p-4 hover-lift cursor-pointer backdrop-blur-sm">
                            <div className="relative mb-3">
                                <img 
                                    src={rec.thumbnail} 
                                    alt={rec.title}
                                    className="w-full aspect-square object-cover rounded-xl"
                                />
                                <div className="play-button-overlay">
                                    <i className="fas fa-play text-white text-2xl"></i>
                                </div>
                            </div>
                            <h3 className="font-semibold text-white text-sm mb-1 truncate">{rec.title}</h3>
                            <p className="text-white/70 text-xs truncate">{rec.artist}</p>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    )}

    {/* Search Results */}
    {activeTab === 'search' && (
        <div className="fade-in">
            {loading ? (
                <div className="text-center py-16">
                    <div className="animate-spin w-12 h-12 border-4 border-white border-t-transparent rounded-full mx-auto mb-4"></div>
                    <h3 className="text-xl font-semibold text-white mb-2">Searching...</h3>
                    <p className="text-white/70">Finding the best results for "{searchQuery}"</p>
                </div>
            ) : (
                <div>
                    <div className="mb-6">
                        <h1 className="text-2xl font-bold text-white">
                            Search Results for: "{searchQuery}"
                        </h1>
                    </div>

                    {/* Artists */}
                    {searchResults.artists && searchResults.artists.length > 0 && (
                        <div className="mb-8">
                            <h2 className="text-2xl font-bold text-white mb-4">Artists</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {searchResults.artists.map((artist, index) => (
                                    <div key={artist.id} className="bg-white/10 rounded-2xl p-4 text-center hover-lift cursor-pointer backdrop-blur-sm" onClick={() => handleArtistClick(artist.id)}>
                                        <img 
                                            src={artist.thumbnail} 
                                            alt={artist.name}
                                            className="w-20 h-20 rounded-full mx-auto mb-3 object-cover"
                                        />
                                        <h3 className="font-semibold text-white text-sm">{artist.name}</h3>
                                        <p className="text-white/70 text-xs">Artist</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Albums */}
                    {searchResults.albums && searchResults.albums.length > 0 && (
                        <div className="mb-8">
                            <h2 className="text-2xl font-bold text-white mb-4">Albums</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                {searchResults.albums.map((album, index) => (
                                    <div key={album.id} className="bg-white/10 rounded-2xl p-4 hover-lift cursor-pointer backdrop-blur-sm">
                                        <img 
                                            src={album.thumbnail} 
                                            alt={album.title}
                                            className="w-full aspect-square object-cover rounded-xl mb-3"
                                        />
                                        <h3 className="font-semibold text-white text-sm mb-1 truncate">{album.title}</h3>
                                        <p className="text-white/70 text-xs truncate">{album.artist}</p>
                                        {album.year && <p className="text-white/60 text-xs">{album.year}</p>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Songs */}
                    {searchResults.songs && searchResults.songs.length > 0 && (
                        <div>
                            <h2 className="text-2xl font-bold text-white mb-4">Songs</h2>
                            <div className="space-y-2">
                                {searchResults.songs.map((song, index) => (
                                    <div key={`${song.id}-${index}`} className="bg-white/10 rounded-xl p-4 hover:bg-white/20 transition-all backdrop-blur-sm">
                                        <div className="flex items-center gap-4">
                                            <div className="relative flex-shrink-0">
                                                <img 
                                                    src={song.thumbnail} 
                                                    alt={song.title}
                                                    className="w-12 h-12 rounded-lg object-cover"
                                                />
                                                <button
                                                    onClick={() => handlePlaySong(song)}
                                                    className="play-button-overlay"
                                                    title="Play song"
                                                >
                                                    <i className="fas fa-play text-white text-sm"></i>
                                                </button>
                                            </div>
                                            
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center mb-1">
                                                    <h3 className="font-semibold text-white text-base truncate">
                                                        {song.title}
                                                    </h3>
                                                    {song.is_explicit && (
                                                        <div className="explicit-badge" title="Explicit">
                                                            E
                                                        </div>
                                                    )}
                                                </div>
                                                
                                                <div className="text-sm text-white/70 mb-1">
                                                    <span className="font-medium">{song.artist}</span>
                                                    {song.album && <span> • {song.album}</span>}
                                                </div>
                                                
                                                <div className="flex items-center gap-3 text-xs text-white/60 flex-wrap">
                                                    <span>Duration: {song.duration}</span>
                                                    <span>•</span>
                                                    <span>{song.views || 'No views'}</span>
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center gap-2 flex-shrink-0">
                                                <button
                                                    onClick={() => handlePlaySong(song)}
                                                    className="bg-white/20 text-white p-2 rounded-lg hover:bg-white/30 transition-all flex items-center justify-center"
                                                    title="Play"
                                                    style={{ width: '40px', height: '40px' }}
                                                >
                                                    <i className="fas fa-play text-sm"></i>
                                                </button>
                                                <button
                                                    onClick={() => handleDownload(song)}
                                                    disabled={downloading === song.id}
                                                    className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 ${
                                                        downloading === song.id 
                                                            ? 'bg-green-500/20 text-green-300 cursor-not-allowed' 
                                                            : 'bg-white/20 text-white hover:bg-white/30'
                                                    }`}
                                                    style={{ height: '40px' }}
                                                >
                                                    {downloading === song.id ? (
                                                        <>
                                                            <div className="animate-spin w-4 h-4 border-2 border-green-300 border-t-transparent rounded-full"></div>
                                                            <span className="hidden sm:inline">Downloading...</span>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <i className="fas fa-download"></i>
                                                            <span className="hidden sm:inline">Download</span>
                                                        </>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* No results */}
                    {(!searchResults.songs || searchResults.songs.length === 0) && 
                     (!searchResults.artists || searchResults.artists.length === 0) && 
                     (!searchResults.albums || searchResults.albums.length === 0) && (
                        <div className="text-center py-16">
                            <i className="fas fa-search text-white/40 text-6xl mb-4"></i>
                            <h3 className="text-xl font-semibold text-white mb-2">No results found</h3>
                            <p className="text-white/70">Try different keywords or check your spelling</p>
                        </div>
                    )}
                </div>
            )}
        </div>
    )}

    {/* Your Songs Page */}
    {activeTab === 'songs' && (
        <div className="fade-in">
            <h2 className="text-2xl font-bold text-white mb-6">Your Downloaded Songs</h2>
            {songs.length === 0 ? (
                <div className="text-center py-16">
                    <i className="fas fa-music text-white/40 text-6xl mb-4"></i>
                    <h3 className="text-xl font-semibold text-white mb-2">No songs yet</h3>
                    <p className="text-white/70">Downloaded songs will appear here</p>
                </div>
            ) : (
                <div className="space-y-2">
                    {songs.map(song => (
                        <div key={song.id} className="bg-white/10 rounded-xl p-4 hover:bg-white/20 transition-all backdrop-blur-sm">
                            <div className="flex items-center gap-4">
                                <img 
                                    src={song.thumbnail} 
                                    alt={song.title}
                                    className="w-12 h-12 rounded-lg object-cover"
                                />
                                <div className="flex-1">
                                    <h3 className="font-semibold text-white text-lg">{song.title}</h3>
                                    <div className="text-white/70 text-sm">
                                        {song.artist} • {song.album} • Downloaded {song.downloaded_at}
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => playDownloadedSong(song.id)}
                                        className="bg-white/20 text-white px-4 py-2 rounded-lg hover:bg-white/30 transition-all"
                                    >
                                        <i className="fas fa-play mr-2"></i>
                                        Play
                                    </button>
                                    <button
                                        onClick={() => downloadToComputer(song.id)}
                                        className="bg-white/20 text-white px-4 py-2 rounded-lg hover:bg-white/30 transition-all"
                                    >
                                        <i className="fas fa-download mr-2"></i>
                                        Download
                                    </button>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            )}
        </div>
    )}

    {/* Your Artists Page */}
    {activeTab === 'artists' && (
        <div className="fade-in">
            <h2 className="text-2xl font-bold text-white mb-6">Your Artists</h2>
            {Object.keys(artists).length === 0 ? (
                <div className="text-center py-16">
                    <i className="fas fa-users text-white/40 text-6xl mb-4"></i>
                    <h3 className="text-xl font-semibold text-white mb-2">No artists yet</h3>
                    <p className="text-white/70">Artists from downloaded songs will appear here</p>
                </div>
            ) : (
                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    {Object.entries(artists).map(([artistName, songCount]) => (
                        <div key={artistName} className="bg-white/10 rounded-2xl p-4 text-center hover-lift cursor-pointer backdrop-blur-sm">
                            <div className="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center mx-auto mb-3">
                                <i className="fas fa-user text-white/60 text-2xl"></i>
                            </div>
                            <h3 className="font-semibold text-white text-sm mb-1 truncate">{artistName}</h3>
                            <p className="text-white/70 text-xs">{songCount} {songCount === 1 ? 'song' : 'songs'}</p>
                        </div>
                    ))}
                </div>
            )}
        </div>
    )}

    {/* Settings Page */}
    {activeTab === 'settings' && (
        <div className="fade-in max-w-2xl mx-auto">
            <h2 className="text-2xl font-bold text-white mb-6">Settings</h2>
            
            {/* Authentication Section */}
            <div className="bg-white/10 rounded-2xl p-6 mb-6 backdrop-blur-sm">
                <h3 className="text-xl font-semibold text-white mb-4">Authentication</h3>
                {userAuthenticated ? (
                    <div className="flex items-center gap-3 text-green-300">
                        <i className="fas fa-check-circle text-xl"></i>
                        <p>Connected to YouTube Music</p>
                    </div>
                ) : (
                    <div>
                        <p className="text-white/70 mb-4">Paste your browser.json content to connect to YouTube Music</p>
                        <textarea
                            value={browserJson}
                            onChange={(e) => setBrowserJson(e.target.value)}
                            placeholder="Paste browser.json content here..."
                            className="w-full h-32 p-4 rounded-lg bg-white/20 text-white placeholder-white/50 mb-4 resize-none"
                        ></textarea>
                        <button
                            onClick={handleAuthenticate}
                            disabled={loading}
                            className="bg-white/20 text-white px-6 py-3 rounded-lg hover:bg-white/30 transition-all disabled:opacity-50"
                        >
                            {loading ? (
                                <>
                                    <div className="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full inline-block mr-2"></div>
                                    Connecting...
                                </>
                            ) : (
                                <>
                                    <i className="fas fa-link mr-2"></i>
                                    Connect
                                </>
                            )}
                        </button>
                    </div>
                )}
            </div>

            {/* Data Management Section */}
            <div className="bg-white/10 rounded-2xl p-6 backdrop-blur-sm">
                <h3 className="text-xl font-semibold text-white mb-4">Data Management</h3>
                <div className="flex flex-col sm:flex-row gap-4 mb-4">
                    <button
                        onClick={handleExportData}
                        className="bg-white/20 text-white px-6 py-3 rounded-lg hover:bg-white/30 transition-all flex items-center justify-center"
                    >
                        <i className="fas fa-download mr-2"></i>
                        Export Data
                    </button>
                    <label className="bg-white/20 text-white px-6 py-3 rounded-lg hover:bg-white/30 transition-all flex items-center justify-center cursor-pointer">
                        <i className="fas fa-upload mr-2"></i>
                        Import Data
                        <input
                            type="file"
                            accept=".json"
                            onChange={handleImportData}
                            className="hidden"
                        />
                    </label>
                </div>
                <p className="text-white/70 text-sm">Export or import your downloaded songs and artists data</p>
                
                {/* Stats */}
                <div className="mt-6 pt-6 border-t border-white/20">
                    <h4 className="text-lg font-semibold text-white mb-3">Your Statistics</h4>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white/10 rounded-lg p-4 text-center">
                            <div className="text-2xl font-bold text-white mb-1">{songs.length}</div>
                            <div className="text-white/70 text-sm">Downloaded Songs</div>
                        </div>
                        <div className="bg-white/10 rounded-lg p-4 text-center">
                            <div className="text-2xl font-bold text-white mb-1">{Object.keys(artists).length}</div>
                            <div className="text-white/70 text-sm">Artists</div>
                        </div>
                    </div>
                </div>
            </div>
                </div>
            )}
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('app'));
</script>
</body>
</html>
